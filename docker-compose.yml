services:
  api:
    image: credit-risk-mlops:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit-risk-api
    restart: unless-stopped
    environment:
      - CREDIT_RISK_ENV=prod
      - PORT=8000
      - API_WORKERS=2
    ports:
      - "8000:8000"
    volumes:
      - api-models:/app/models
      - api-mlruns:/app/mlruns
      - api-logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - credit-risk-net

  prometheus:
    image: prom/prometheus:latest
    container_name: credit-risk-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - credit-risk-net

  grafana:
    image: grafana/grafana:latest
    container_name: credit-risk-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - credit-risk-net

networks:
  credit-risk-net:
    driver: bridge

volumes:
  api-models:
  api-mlruns:
  api-logs: