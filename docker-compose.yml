# Docker Compose profissional para API FastAPI.
# Nesta etapa mantemos apenas a API.
# O serviço do MLflow será adicionado na fase de infraestrutura
# (Model Registry + Deploy + AWS + Observabilidade).

services:
  api:
    image: credit-risk-mlops:latest
    build:
      context: .
      dockerfile: Dockerfile

    container_name: credit-risk-api

    environment:
      - CREDIT_RISK_ENV=prod
      - PORT=8000
      - API_WORKERS=2

      # Será utilizado quando o MLflow Server for implantado
      # - MLFLOW_TRACKING_URI=http://mlflow:5000

    ports:
      - "8000:8000"

    # Será habilitado quando o serviço MLflow existir
    # depends_on:
    #   - mlflow

    networks:
      - credit-risk-net

# ======================================================
# ETAPA FUTURA
#
# O MLflow Server será utilizado quando implementarmos:
