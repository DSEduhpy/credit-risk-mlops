name: Credit Risk CI

on:

  push:

    branches:
      - main
      - master

  pull_request:

    branches:
      - main
      - master

jobs:

  tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.14"

      - name: Upgrade pip

        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies

        run: |
          pip install -r requirements.txt

      - name: Ruff

        run: |
          ruff check .

      - name: Black

        run: |
          black --check .

      - name: isort

        run: |
          isort --check-only .

      - name: Pytest

        run: |
          pytest